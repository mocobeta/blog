# serene v6.0.0 (Zola >= 0.23.4)
#
# - docs: https://github.com/isunjn/serene/blob/latest/USAGE.md
# - check for updates: https://github.com/isunjn/serene/releases
#
#=========================================================================================

base_url = "https://blog.mocobeta.dev"
title = "Keep Building"
description = "Blog by a software engineer in Search/AI"
default_language = "en"
theme = "serene"
output_dir = "public"
compile_sass = true
minify_html = true
build_search_index = false
generate_feeds = true
feed_filenames = ["feed.xml"]
taxonomies = [{ name = "tags" }, { name = "categories" }]
# Render examples of template syntax in posts literally.
skip_content_templating = [
    "posts/20250505-til-zola-ogptag/**",
    "posts/20251219-hello-evals/**",
    "posts/20251224-evals-api-get-started/**",
]

[markdown]
render_emoji = false
external_links_target_blank = false
external_links_no_follow = true
external_links_no_referrer = true
smart_punctuation = false
github_alerts = true

[markdown.highlighting]
style = "class"
light_theme = "github-light"
dark_theme  = "github-dark"

[slugify]
paths = "on"
taxonomies = "on"
anchors = "on"

#=========================================================================================

[extra]
name = "Keep Building"
handle = "mocobeta"
bio = "software engineer in Search/AI"
avatar = "img/avatar.webp"
og_image = "img/search-system-book-penguin.jpg"
date_format = "%Y-%m-%d"

links = [
    { name = "GitHub", icon = "github", url = "https://github.com/mocobeta" },
    { name = "Bluesky", icon = "bluesky", url = "https://bsky.app/profile/mocobeta.dev" },
    { name = "LinkedIn", icon = "linkedin", url = "https://www.linkedin.com/in/tomoko-u-643195249/" },
    { name = "Email", icon = "email", url = "mailto:contact@mocobeta.dev" },
]

nav = [
    { name = "posts", path = "/posts" },
    { name = "projects", path = "/projects" },
    { name = "about", path = "/about" },
]
blog_section_path = "/posts"

back_link_text = "Back" # Text of the back button
color_scheme = "auto" # "auto" | "light" | "dark"

footer_copyright = "© 2026 Tomoko Uchida"
footer_credits = true # Whether to show "Built with zola and serene" in footer

not_found_error_text = "404 Not Found"
not_found_recover_text = "« back to home »"

reaction = false # Whether to enable anonymous emoji reactions (Note: You need to set up a working api endpoint to enable this feature)
reaction_align = "right" # "left" | "center" | "right"
reaction_endpoint = "https://example.com/api/reaction"
